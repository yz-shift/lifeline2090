/* ------------------------------------------------------------------ reduced motion */

@media (prefers-reduced-motion: reduce) {
  .g-game *, .g-game *::before, .g-ov, .g-ov *, .g-death *, .g-curtain {
    animation: none !important;
    transition: none !important;
  }
  .g-dlg { transform: none; }
  .g-cert--enter, .g-cert--enter .g-seal { opacity: 1; }
  .g-cert--enter { transform: none; }
  .g-cert--enter .g-seal { opacity: 0.85; transform: rotate(-12deg); }
}

/* 人生风景: generative illustration above the life log */
.g-scene { margin: 0 0 12px; border: 1px solid var(--line); background: var(--paper-2); overflow: hidden; }
.g-scene-cv { display: block; width: 100%; height: 160px; }
.g-scene-cap { margin: 0; padding: 6px 10px; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); font-family: var(--font-mono); letter-spacing: 0.02em; }
@media (max-width: 560px) { .g-scene-cap { font-size: 11px; } }
.g-realmem { display: grid; gap: 10px; border-style: dashed; }
.g-realmem-k { margin: 0; line-height: 1.7; color: var(--ink); }
.g-realmem-a { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* src/ui/panels.css */
/* Interactivity layer v2: the life's side sheet (家人与生活 / 花钱·投资: a side sheet on wide screens, a bottom sheet
   on phones), the two panels inside it, the home screen's "开始之前" preferences, the settings additions (how automatic
   choices lean, the birthplace comparison) and the death screen additions (summary, comparison, final words, starred
   moments, notes, children's lives, rare moments). Uses only the tokens defined in styles.css. Shell pieces use the
   .ll- prefix, death screen pieces the .g- prefix. */

/* ------------------------------------------------------------------ the sheet */

:root.ll-sheet-open { overflow: hidden; }
.ll-sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.ll-sheet-scrim { position: absolute; inset: 0; background: var(--overlay); }
.ll-sheet {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  width: min(480px, 100%);
  min-width: 0;
  background: var(--paper);
  border-left: 1px solid var(--ink);
  box-shadow: var(--shadow);
  padding-top: env(safe-area-inset-top, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.ll-sheet-grip { display: none; }
.ll-sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 16px var(--gutter) 10px 20px;
  border-top: 4px solid var(--ink);
}
.ll-sheet-heading { min-width: 0; }
.ll-sheet-eyebrow { font-size: 11.5px; letter-spacing: 0.08em; text-transform: none; overflow-wrap: anywhere; }
.ll-sheet-title { margin-top: 2px; font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1.3; letter-spacing: 0.08em; }
.ll-sheet-close {
  flex: none;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  margin: -4px -6px 0 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 26px;
  line-height: 1;
}
.ll-sheet-close:hover { background: var(--paper-2); border-color: var(--ink-3); }
.ll-sheet-tabs { display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--line); }
.ll-sheet-tab {
  position: relative;
  min-height: 44px;
  padding: 8px 14px;
  border: 0;
  background: none;
  color: var(--ink-3);
  font-size: 14.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.ll-sheet-tab:hover { color: var(--ink); }
.ll-sheet-tab[aria-selected="true"] { color: var(--ink); }
.ll-sheet-tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--ink); }
.ll-sheet-note {
  margin: 0;
  padding: 6px 20px;
  background: var(--paper-2);
  border-bottom: 1px dashed var(--line);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
}
.ll-sheet-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 20px calc(24px + env(safe-area-inset-bottom, 0px));
}
.ll-sheet-body:focus { outline: none; }
.ll-sheet-body:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.ll-sheet-err { display: grid; gap: 6px; padding: 14px; border: 1px dashed var(--bad); color: var(--ink-2); }

.ll-sheet-wrap--anim .ll-sheet-scrim { opacity: 0; transition: opacity 0.2s ease; }
.ll-sheet-wrap--anim .ll-sheet { transform: translateX(24px); opacity: 0; transition: transform 0.22s ease-out, opacity 0.18s ease-out; }
.ll-sheet-wrap--anim.is-in .ll-sheet-scrim { opacity: 1; }
.ll-sheet-wrap--anim.is-in .ll-sheet { transform: none; opacity: 1; }

@media (max-width: 640px) {
  .ll-sheet {
    top: auto;
    left: 0;
    width: 100%;
    max-height: calc(100vh - 40px);
    border-left: 0;
    border-top: 1px solid var(--ink);
    border-radius: 12px 12px 0 0;
    padding-top: 0;
    padding-right: 0;
  }
  @supports (height: 100dvh) {
    .ll-sheet { max-height: calc(100dvh - 40px - env(safe-area-inset-top, 0px)); }
  }
  .ll-sheet-grip { display: block; width: 40px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: var(--line); }
  .ll-sheet-head { border-top: 0; padding: 8px 12px 8px var(--gutter); }
  .ll-sheet-title { font-size: 20px; }
  .ll-sheet-tabs { padding: 0 6px; }
  .ll-sheet-tab { flex: 1 1 0; padding: 8px 6px; }
  .ll-sheet-note { padding: 6px var(--gutter); }
  .ll-sheet-body { padding: 12px var(--gutter) calc(20px + env(safe-area-inset-bottom, 0px)); }
  .ll-sheet-wrap--anim .ll-sheet { transform: translateY(32px); }
}

/* ------------------------------------------------------------------ shared panel pieces */

.ll-sheet :where(p, h3, dl, dd, figure, blockquote) { margin: 0; }
.ll-pn-empty { display: grid; gap: 6px; padding: 24px 4px; text-align: center; color: var(--ink-2); }
.ll-pn-sec { display: grid; gap: 10px; padding: 16px 0; border-top: 1px solid var(--line); min-width: 0; }
.ll-pn-sec:first-child { border-top: 0; padding-top: 4px; }
.ll-pn-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 16px;
  letter-spacing: 0.08em;
}
.ll-pn-h-sub { font-family: var(--font-body); font-weight: 400; font-size: 12px; letter-spacing: 0; color: var(--ink-3); text-align: right; }
.ll-pn-lock { margin-bottom: 12px !important; padding: 8px 12px; border: 1px dashed var(--ink-3); background: var(--paper-2); font-size: 13px; color: var(--ink-2); }
.ll-pn-foot { margin-top: 8px !important; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; line-height: 1.7; color: var(--ink-3); }

/* ------------------------------------------------------------------ 花钱·投资 */

.ll-mn-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); background: var(--paper-2); }
.ll-mn-tile { display: grid; align-content: start; gap: 2px; padding: 10px 12px; border-left: 1px solid var(--line); min-width: 0; }
.ll-mn-tile:first-child { border-left: 0; }
.ll-mn-tile-k { font-size: 12px; color: var(--ink-3); }
.ll-mn-tile-v { font-family: var(--font-mono); font-weight: 700; font-size: 17px; line-height: 1.3; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ll-mn-tile-s { font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }
.ll-mn-tile.is-neg .ll-mn-tile-v, .ll-mn-tile.is-debt .ll-mn-tile-v { color: var(--bad); }
.ll-mn-tiles + .ll-pn-sec { border-top: 0; }

.ll-mn-bd { display: grid; gap: 8px; }
.ll-mn-income { font-size: 13.5px; color: var(--ink-2); }
.ll-mn-income b { font-family: var(--font-mono); color: var(--ink); }
.ll-mn-none { font-size: 13.5px; color: var(--ink-2); }
.ll-mn-bar { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; background: var(--paper); }
.ll-mn-bar--alloc { height: 12px; }
.ll-mn-seg { flex: 1 1 0px; min-width: 3px; transition: opacity 0.15s; }
.ll-mn-seg.is-dim { opacity: 0.28; }
.ll-mn-cap { min-height: 1.6em; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ll-mn-legend { list-style: none; margin: 0; padding: 0; display: grid; }
.ll-mn-row {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr) auto 3.2em;
  align-items: baseline;
  gap: 8px;
  padding: 6px 4px;
  border-top: 1px dotted var(--line);
  font-size: 13.5px;
}
.ll-mn-row:first-child { border-top: 0; }
.ll-mn-row.is-hot { background: var(--paper-2); }
.ll-mn-sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; align-self: center; }
.ll-mn-row-k { min-width: 0; overflow-wrap: anywhere; }
.ll-mn-row-sub { display: block; font-size: 11.5px; color: var(--ink-3); }
.ll-mn-row-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ll-mn-row-p { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }
.ll-mn-warn { padding: 6px 10px; border-left: 3px solid var(--warn); background: var(--paper-2); font-size: 13px; color: var(--ink-2); }

.ll-mn-dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.ll-mn-dl > div { display: grid; padding: 8px 10px; border: 1px solid var(--line); min-width: 0; }
.ll-mn-dl dt { font-size: 12px; color: var(--ink-3); }
.ll-mn-dl dd { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.ll-mn-mode .ll-boxes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ll-mn-custom { display: grid; gap: 12px; padding: 12px; border: 1px solid var(--line); background: var(--paper-2); }
.ll-mn-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ll-mn-presets-k { margin-right: 4px; font-size: 12.5px; color: var(--ink-3); }
.ll-mn-asset { display: grid; gap: 2px; }
.ll-mn-asset-head { display: flex; align-items: center; gap: 8px; }
.ll-mn-asset-k { flex: 1 1 auto; font-weight: 700; font-size: 14px; }
.ll-mn-pct { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.ll-mn-range { min-height: 32px; }
.ll-mn-saved { font-size: 12.5px; color: var(--good); }
.ll-mn-saved:empty { display: none; }
.ll-mn-habits { display: grid; gap: 10px; }

/* the habit rows (also in the family panel) */
.ll-habit { display: grid; gap: 6px; margin: 0; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.ll-habit.is-locked { background: var(--paper-2); }
/* a floated legend sits inside the box (a grid item) instead of breaking the border line */
.ll-habit-name { float: left; width: 100%; padding: 0; font-weight: 700; font-size: 14.5px; }
.ll-habit-sub { margin-top: -4px !important; font-size: 12px; color: var(--ink-3); }
.ll-seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--ink-3); border-radius: var(--radius); overflow: hidden; }
.ll-seg-opt {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 0;
  min-height: 48px;
  padding: 6px 4px;
  border-left: 1px solid var(--line);
  background: var(--paper);
  cursor: pointer;
  text-align: center;
  min-width: 0;
}
.ll-seg-opt:first-child { border-left: 0; }
.ll-seg-opt:hover { background: var(--paper-2); }
.ll-seg-opt:has(.ll-seg-input:checked) { background: var(--ink); color: var(--paper); }
.ll-seg-opt:has(.ll-seg-input:checked) .ll-seg-cost { color: var(--paper); opacity: 0.85; }
.ll-seg-opt:has(.ll-seg-input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -3px; }
.ll-seg-opt:has(.ll-seg-input:disabled) { cursor: not-allowed; }
.ll-habit.is-locked .ll-seg { opacity: 0.6; }
.ll-seg-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.ll-seg-label { font-weight: 700; font-size: 14px; line-height: 1.3; }
.ll-seg-cost { font-family: var(--font-mono); font-size: 11px; line-height: 1.35; color: var(--ink-3); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ll-habit-eff { font-size: 12.5px; color: var(--ink-2); }
.ll-habit-eff.is-off { color: var(--ink-3); }
.ll-habit-why { font-size: 12px; color: var(--warn); }

/* ------------------------------------------------------------------ 家人与生活 */

.ll-fam { display: grid; min-width: 0; }
.ll-fam-sum { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ll-fam-sum li { padding: 2px 10px; border: 1px solid var(--ink); border-radius: 999px; font-size: 12.5px; }
.ll-fam-list { list-style: none; margin: 0; padding: 0; display: grid; }
.ll-fam-m { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px dotted var(--line); min-width: 0; }
.ll-fam-m:first-child { border-top: 0; }
.ll-fam-av {
  flex: none;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1.5px solid var(--ink);
  border-radius: 50%;
  background: var(--paper-2);
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 15px;
}
.ll-fam-m.is-gone .ll-fam-av { border-style: dashed; border-color: var(--ink-3); background: none; color: var(--ink-3); }
.ll-fam-main { flex: 1 1 auto; display: grid; gap: 1px; min-width: 0; }
.ll-fam-l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.ll-fam-name { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.ll-fam-m.is-gone .ll-fam-name { color: var(--ink-2); }
.ll-fam-role { font-size: 12.5px; color: var(--ink-3); }
.ll-fam-age { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); }
.ll-fam-m.is-gone .ll-fam-age { font-family: var(--font-body); color: var(--ink-3); }
.ll-fam-status { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.ll-fam-note { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; }
.ll-fam-close {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  padding: 1px 8px;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 12px;
  white-space: nowrap;
}
.ll-fam-close.is-close { color: var(--good); }
.ll-fam-close.is-ok { color: var(--ink-2); }
.ll-fam-close.is-distant { color: var(--warn); border-style: dashed; }
.ll-fam-plain { font-size: 13.5px; color: var(--ink-2); }
.ll-fam-friends { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13.5px; color: var(--ink-2); }
.ll-fam-dots { display: inline-flex; flex-wrap: wrap; gap: 3px; }
.ll-fam-dots i { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--st-relationships); }
.ll-fam-k { margin-top: 2px !important; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-3); }
.ll-fam-chips { margin-top: -4px; }
.ll-fam-cond { border-color: var(--ink-3); }
.ll-fam-cond-sub { margin-left: 6px; font-size: 11.5px; color: var(--ink-3); }
.ll-fam-more { justify-self: start; }
.ll-fam-naming { padding: 12px; border: 1px solid var(--ink); border-top-width: 3px; background: var(--paper-2); }
.ll-fam-names { display: flex; flex-wrap: wrap; gap: 6px; }
.ll-fam-names .ll-btn { min-height: 40px; font-size: 15px; font-family: var(--font-display); font-weight: 700; }
.ll-fam-name-form { display: flex; gap: 8px; }
.ll-fam-name-in { flex: 1 1 auto; font-size: 15px; padding: 7px 10px; }
.ll-fam-name-form .ll-btn { min-height: 40px; }
.ll-fam-name-st { min-height: 1.4em; font-size: 12.5px; color: var(--warn); }

/* ------------------------------------------------------------------ shared form pieces: select, texture, birthplace */

.ll-select {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--ink-3);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: 15px;
}
.ll-select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--ink); }
.ll-texture-desc { margin-top: -2px; }
#ll-set-texture .ll-boxes-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }

.ll-cmp { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
.ll-cmp-row { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em; gap: 10px; }
.ll-cmp-year { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ll-cmp-yhint.is-bad { color: var(--bad); }
@media (max-width: 400px) {
  .ll-cmp-row { grid-template-columns: minmax(0, 1fr); }
}

/* home: "开始之前" */
.ll-prefs { margin-top: 4px; border-top: 1px solid var(--line); }
.ll-prefs-sum {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  min-height: 44px;
  padding: 12px 28px 8px 0;
  position: relative;
  cursor: pointer;
  list-style: none;
}
.ll-prefs-sum::-webkit-details-marker { display: none; }
.ll-prefs-sum::after {
  content: "";
  position: absolute;
  right: 6px;
  top: 18px;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--ink-2);
  border-bottom: 2px solid var(--ink-2);
  transform: rotate(45deg);
  transition: transform 0.15s;
}
.ll-prefs[open] .ll-prefs-sum::after { transform: rotate(-135deg); top: 22px; }
.ll-prefs-k { font-weight: 700; font-size: 14px; letter-spacing: 0.06em; }
.ll-prefs-now { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.ll-prefs-body { display: grid; gap: 16px; padding: 6px 0 4px; }
.ll-prefs-sw { display: grid; gap: 12px; }

/* ------------------------------------------------------------------ death screen additions */

.g-recap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.g-recap--one { grid-template-columns: minmax(0, 1fr); }
.g-recap-lines { display: grid; gap: 0; }
.g-recap-lines li {
  position: relative;
  padding: 7px 0 7px 18px;
  border-top: 1px dotted var(--line);
  font-size: 15px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
.g-recap-lines li:first-child { border-top: 0; }
.g-recap-lines li::before { content: ""; position: absolute; left: 2px; top: 1.05em; width: 7px; height: 7px; border: 1.5px solid var(--ink-2); transform: rotate(45deg); }
.g-compare { display: grid; gap: 8px; align-content: start; }
.g-compare .g-h { margin-bottom: 2px; }
.g-cmp-line { font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
.g-cmp-line + .g-cmp-line { padding-top: 8px; border-top: 1px dotted var(--line); }
.g-cmp-note { font-size: 13px; color: var(--ink-2); }
.g-compare .g-src { margin-top: 4px; }
.g-compare--invite { border-top-style: dashed; }

.g-final { display: grid; gap: 10px; border-top-color: var(--seal); }
.g-final .g-h { margin-bottom: 0; }
.g-final-ta {
  width: 100%;
  min-width: 0;
  min-height: 5.5em;
  padding: 10px 12px;
  border: 1px solid var(--ink-3);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 17px;
  line-height: 1.7;
  resize: vertical;
}
.g-final-ta:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--ink); }
.g-final-row { align-items: center; }
.g-final-count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.g-final-said { padding: 14px 12px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); text-align: center; }
.g-final-said blockquote { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.65; letter-spacing: 0.04em; overflow-wrap: anywhere; }
.g-final-said figcaption { margin-top: 6px; font-size: 12px; letter-spacing: 0.2em; color: var(--ink-3); }

.g-star-mark { color: var(--warn); }
.g-stars-list { display: grid; }
.g-star { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px dotted var(--line); }
.g-star:first-child { border-top: 0; }
.g-star-when { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.g-star--proj .g-star-when { color: var(--proj); }
.g-star-t { font-size: 14.5px; line-height: 1.75; overflow-wrap: anywhere; }

.g-notes-list { display: grid; gap: 12px; }
.g-note { display: grid; gap: 4px; }
.g-note-q { font-size: 12.5px; color: var(--ink-3); }
.g-note-t { padding: 8px 12px; border-left: 3px solid var(--ink-2); background: var(--paper-2); font-family: var(--font-display); font-size: 15.5px; line-height: 1.75; overflow-wrap: anywhere; }

.g-rare-list { display: grid; gap: 8px; }
.g-rare-i { display: flex; align-items: flex-start; gap: 10px; }
.g-rare-mark { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid var(--warn); border-radius: 50%; color: var(--warn); font-size: 15px; }
.g-rare-main { display: grid; min-width: 0; }
.g-rare-t { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
.g-rare-w { font-size: 12px; color: var(--ink-3); }

@media (max-width: 860px) {
  .g-recap { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .g-star { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .ll-mn-tiles { grid-template-columns: minmax(0, 1fr); }
  .ll-mn-tile { border-left: 0; border-top: 1px solid var(--line); grid-template-columns: 5.5em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
  .ll-mn-tile:first-child { border-top: 0; }
  .ll-mn-tile-s { grid-column: 2; }
  .ll-mn-mode .ll-boxes-grid { grid-template-columns: minmax(0, 1fr); }
  .ll-mn-dl { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .ll-sheet-wrap--anim .ll-sheet, .ll-sheet-wrap--anim .ll-sheet-scrim { transition: none; transform: none; opacity: 1; }
}

/* src/ui/social.css */
/* Social screens: shared lives feed, memorial, shared life detail, past lives. Prefix .s-
   Uses only the tokens defined in styles.css (CONTRACT §8). */

.s-page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 var(--gutter) 64px;
  color: var(--ink);
  font-family: var(--font-body);
  box-sizing: border-box;
  min-width: 0;
}
.s-page *, .s-page *::before, .s-page *::after { box-sizing: border-box; }
.s-page [hidden] { display: none !important; }

/* ---------------------------------------------------------------- header */
.s-head { padding: 28px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.s-head--center { text-align: center; border-bottom: 0; padding-bottom: 8px; }
.s-head--center .s-lede { margin: 0 auto; }
.s-kicker {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--seal);
  margin: 0 0 6px;
  overflow-wrap: anywhere;
}
.s-title {
  font-family: var(--font-display);
  font-size: clamp(26px, 5vw, 38px);
  line-height: 1.2;
  font-weight: 700;
  margin: 0 0 8px;
  color: var(--ink);
}
.s-lede { color: var(--ink-2); max-width: 46em; margin: 0; line-height: 1.75; }
.s-head-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.s-count { font-size: 13px; color: var(--ink-3); margin: 0 0 12px; }
.s-muted { color: var(--ink-3); line-height: 1.7; }
.s-loading { color: var(--ink-3); padding: 40px 0; text-align: center; }

/* ---------------------------------------------------------------- controls */
.s-btn {
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
  font-size: 14px;
  line-height: 1.2;
  padding: 9px 14px;
  min-height: 38px;
  border-radius: var(--radius);
  border: 1px solid var(--ink-3);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}
.s-btn:hover:not(:disabled) { border-color: var(--ink); }
.s-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.s-btn:disabled { opacity: 0.5; cursor: default; }
.s-btn--primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.s-btn--primary:hover:not(:disabled) { background: var(--ink-2); border-color: var(--ink-2); }
.s-btn--ghost { background: transparent; border-color: var(--line); color: var(--ink-2); }
.s-btn--ghost:hover:not(:disabled) { color: var(--ink); }
.s-btn--danger { background: transparent; color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.s-btn--danger:hover:not(:disabled) { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 8%, transparent); }
.s-btn--sm { padding: 6px 10px; min-height: 32px; font-size: 13px; }
.s-btn--candle {
  background: color-mix(in srgb, var(--warn) 14%, var(--paper));
  border-color: color-mix(in srgb, var(--warn) 55%, var(--line));
  min-width: 11em;
}
.s-btn--candle:hover:not(:disabled) { border-color: var(--warn); }
.s-more { display: flex; margin: 22px auto 0; }

.s-link {
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  font-size: 12px;
  color: var(--ink-3);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.s-link:hover { color: var(--bad); }
.s-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.s-back {
  background: none;
  border: 0;
  padding: 14px 0 6px;
  font: inherit;
  font-size: 14px;
  color: var(--ink-2);
  cursor: pointer;
}
.s-back:hover { color: var(--ink); }
.s-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.s-filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; margin: 8px 0 12px; }
.s-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 150px; max-width: 240px; min-width: 0; }
.s-field-label { font-size: 12px; color: var(--ink-3); }
.s-select {
  font: inherit;
  font-size: 14px;
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}
.s-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.s-textarea {
  font: inherit;
  width: 100%;
  min-height: 76px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  resize: vertical;
}
.s-textarea::placeholder { color: var(--ink-3); }
.s-textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.s-textarea:disabled { background: var(--paper-2); color: var(--ink-3); }
.s-textarea--mono { font-family: var(--font-mono); font-size: 12px; }

.s-seg {
  display: flex;
  width: max-content;
  max-width: 100%;
  margin: 8px auto 22px;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--paper);
}
.s-seg-btn {
  font: inherit;
  font-size: 13px;
  padding: 8px 18px;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
}
.s-seg-btn + .s-seg-btn { border-left: 1px solid var(--line); }
.s-seg-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.s-seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ---------------------------------------------------------------- banners, badges, empty states */
.s-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin: 16px 0 0;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-2);
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-left: 3px solid var(--proj);
  border-radius: var(--radius);
}
.s-banner strong { color: var(--ink); white-space: nowrap; }
.s-banner--warn { border-left-color: var(--warn); }

.s-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.s-badge {
  display: inline-block;
  font-size: 12px;
  line-height: 1.45;
  padding: 1px 8px;
  margin-right: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink-2);
  background: var(--paper);
  vertical-align: 1px;
  overflow-wrap: anywhere;
}
.s-badges .s-badge { margin-right: 0; }
.s-badge--real { border-color: var(--ink-2); color: var(--ink); }
.s-badge--proj {
  border-style: dashed;
  border-color: var(--proj);
  color: var(--proj);
  background: color-mix(in srgb, var(--proj) 8%, var(--paper));
}
.s-badge--seal { border-color: var(--seal); color: var(--seal); }

.s-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px 20px;
  background: var(--paper);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.s-empty-mark { display: flex; justify-content: center; }
.s-empty-title { font-family: var(--font-display); font-size: 20px; margin: 10px 0 6px; color: var(--ink); }
.s-empty-body { color: var(--ink-2); max-width: 32em; margin: 0 auto; line-height: 1.75; }
.s-empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }

.s-fiction {
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink-3);
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 28px;
}
.s-footnote { font-size: 12px; color: var(--ink-3); line-height: 1.75; margin-top: 20px; }

/* ---------------------------------------------------------------- life strip and map */
.s-tag-birth { background: var(--tag-birth); }
.s-tag-childhood { background: var(--tag-childhood); }
.s-tag-study { background: var(--tag-study); }
.s-tag-work { background: var(--tag-work); }
.s-tag-love { background: var(--tag-love); }
.s-tag-family { background: var(--tag-family); }
.s-tag-loss { background: var(--tag-loss); }
.s-tag-illness { background: var(--tag-illness); }
.s-tag-crisis { background: var(--tag-crisis); }
.s-tag-war { background: var(--tag-war); }
.s-tag-migration { background: var(--tag-migration); }
.s-tag-success { background: var(--tag-success); }
.s-tag-calm { background: var(--tag-calm); }
.s-tag-retire { background: var(--tag-retire); }
.s-tag-death { background: var(--tag-death); }
.s-tag-none { background: var(--line); }

.s-strip { display: flex; gap: 1px; height: 10px; margin: 8px 0 2px; }
.s-strip .s-cell { flex: 1 1 0; min-width: 1px; border-radius: 1px; }
.s-strip .s-cell.is-proj { opacity: 0.55; box-shadow: inset 0 -2px 0 var(--proj); }

.s-mapwrap { max-width: 100%; }
.s-map { display: grid; gap: 3px; }
.s-map-row { display: grid; grid-template-columns: 3.2em minmax(0, 360px); align-items: center; gap: 8px; }
.s-map-yr { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); text-align: right; }
.s-map-cells { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.s-map .s-cell { display: block; aspect-ratio: 1; border-radius: 2px; }
.s-map .s-cell.is-proj { opacity: 0.6; outline: 1px dashed var(--proj); outline-offset: -1px; }
.s-map .s-cell.is-void { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--line) 50%, transparent); }

.s-legend {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin: 12px 0 0;
  padding: 0;
  font-size: 12px;
  color: var(--ink-2);
}
.s-legend li { display: inline-flex; align-items: center; gap: 6px; }
.s-legend .s-cell { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.s-legend .s-cell.is-proj { opacity: 0.6; outline: 1px dashed var(--proj); outline-offset: -1px; }
.s-legend-note { color: var(--ink-3); }

/* ---------------------------------------------------------------- candle */
.s-candle { display: inline-block; overflow: visible; vertical-align: middle; flex: none; }
.s-candle-body { fill: color-mix(in srgb, var(--warn) 10%, var(--paper)); stroke: var(--ink-3); stroke-width: 1; }
.s-candle-wick { fill: var(--ink-2); }
.s-candle-flame {
  fill: var(--warn);
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 100%;
  transition: opacity 0.4s ease;
}
.s-candle-glow { fill: var(--warn); opacity: 0; transition: opacity 0.6s ease; }
.s-candle.is-lit .s-candle-flame { opacity: 1; animation: s-flicker 3.2s ease-in-out infinite; }
.s-candle.is-lit .s-candle-glow { opacity: 0.16; animation: s-glow 3.2s ease-in-out infinite; }
.s-candle.is-lighting .s-candle-flame { animation: s-ignite 1.2s ease-out; }
.s-candle.is-lighting .s-candle-glow { animation: s-glow-in 1.2s ease-out; }

@keyframes s-flicker {
  0%, 100% { transform: scale(1, 1); }
  30% { transform: scale(0.94, 1.05); }
  62% { transform: scale(1.04, 0.96); }
}
@keyframes s-glow {
  0%, 100% { opacity: 0.16; }
  50% { opacity: 0.22; }
}
@keyframes s-ignite {
  0% { transform: scale(0.1, 0.1); opacity: 0; }
  55% { transform: scale(1.15, 1.25); opacity: 1; }
  100% { transform: scale(1, 1); opacity: 1; }
}
@keyframes s-glow-in {
  0% { opacity: 0; }
  45% { opacity: 0.45; }
  100% { opacity: 0.16; }
}

.s-candles { display: inline-flex; align-items: center; gap: 4px; }

/* ---------------------------------------------------------------- feed cards */
.s-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.s-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  padding: 14px 16px 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}
.s-card:hover { box-shadow: var(--shadow); border-color: var(--ink-3); }
.s-card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.s-card--ghost { min-height: 190px; background: var(--paper-2); animation: s-pulse 1.6s ease-in-out infinite; }
.s-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.s-card-no { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); margin: 0; }
.s-card-name { font-family: var(--font-display); font-size: 21px; line-height: 1.25; margin: 2px 0 0; overflow-wrap: anywhere; }
.s-card-open {
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: inherit;
  text-align: inherit;
  cursor: pointer;
}
.s-card-open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.s-card-open:focus-visible { outline: none; }
.s-card-meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.s-card-cause { font-size: 13px; color: var(--ink-3); margin: 0; }
.s-card-epitaph { font-family: var(--font-display); font-size: 15px; color: var(--ink); line-height: 1.6; margin: 4px 0 0; overflow-wrap: anywhere; }
.s-card-epitaph::before { content: "「"; color: var(--ink-3); }
.s-card-epitaph::after { content: "」"; color: var(--ink-3); }
.s-card-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 12px;
  color: var(--ink-3);
}
.s-card-time { font-family: var(--font-mono); }

@keyframes s-pulse { 50% { opacity: 0.55; } }

/* ---------------------------------------------------------------- detail */
.s-detail { padding-bottom: 24px; }
.s-detail-top { display: flex; justify-content: space-between; align-items: center; }
.s-detail-head { padding: 8px 0 18px; border-bottom: 1px solid var(--line); }
.s-detail-name {
  font-family: var(--font-display);
  font-size: clamp(28px, 6vw, 44px);
  line-height: 1.15;
  font-weight: 700;
  margin: 0 0 6px;
  overflow-wrap: anywhere;
}
.s-detail-title { font-family: var(--font-display); font-size: 18px; color: var(--ink-2); margin: 0 0 6px; }
.s-detail-meta { color: var(--ink-2); margin: 0; }
.s-detail-cause { color: var(--ink-2); margin: 4px 0 0; }
.s-detail-note { color: var(--ink-3); font-size: 13px; margin: 6px 0 0; }
.s-detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

.s-epitaph {
  margin: 22px 0;
  padding: 18px 12px;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(18px, 3.4vw, 24px);
  line-height: 1.6;
  color: var(--ink);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.s-epitaph p { margin: 0; overflow-wrap: anywhere; }
.s-epitaph p::before { content: "「"; color: var(--ink-3); }
.s-epitaph p::after { content: "」"; color: var(--ink-3); }

.s-section { margin: 24px 0; min-width: 0; }
.s-section-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
}
.s-section-note { font-size: 12px; color: var(--ink-3); margin: -2px 0 10px; }

.s-detail-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0 32px; }
.s-col { min-width: 0; }
.s-bio p { line-height: 1.9; margin: 0 0 0.8em; overflow-wrap: anywhere; }
.s-highlights { list-style: none; margin: 0; padding: 0; }
.s-highlights li {
  position: relative;
  padding: 8px 0 8px 18px;
  line-height: 1.65;
  border-bottom: 1px dashed var(--line);
  overflow-wrap: anywhere;
}
.s-highlights li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 16px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--seal);
}

.s-candlebox {
  margin: 24px 0;
  padding: 22px 16px 18px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--warn) 14%, transparent), transparent 62%),
    var(--paper);
}
.s-candlebox-icon { display: flex; justify-content: center; margin-bottom: 10px; }
.s-candlebox-count { display: block; font-family: var(--font-display); font-size: 20px; margin-bottom: 12px; }
.s-candlebox-note { font-size: 12px; color: var(--ink-3); margin: 10px 0 0; line-height: 1.6; }

.s-stats { display: grid; gap: 8px; margin: 0; }
.s-stat { display: grid; grid-template-columns: 3em minmax(0, 1fr); align-items: center; gap: 8px; }
.s-stat dt { font-size: 13px; color: var(--ink-2); }
.s-stat dd { display: flex; align-items: center; gap: 8px; margin: 0; }
.s-bar { flex: 1; height: 8px; border-radius: 4px; overflow: hidden; background: var(--paper-2); border: 1px solid var(--line); }
.s-bar-fill { display: block; height: 100%; }
.s-bar-num { font-family: var(--font-mono); font-size: 12px; width: 2.2em; text-align: right; color: var(--ink-2); }
.s-st-health { background: var(--st-health); }
.s-st-happiness { background: var(--st-happiness); }
.s-st-knowledge { background: var(--st-knowledge); }
.s-st-relationships { background: var(--st-relationships); }
.s-st-wealth { background: var(--st-wealth); }

/* messages */
.s-composer { display: grid; gap: 8px; margin-bottom: 14px; }
.s-composer-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.s-composer-hint { font-size: 12px; color: var(--ink-3); margin: 0; }
.s-counter { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.s-msgs { list-style: none; margin: 0; padding: 0; }
.s-msg { padding: 12px 0; border-bottom: 1px dashed var(--line); }
.s-msg-text { margin: 0 0 6px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
.s-msg-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-3); }
.s-msg-who { color: var(--ink-2); }
.s-msg-empty { padding: 12px 0; font-size: 14px; color: var(--ink-3); }

.s-moderate { padding: 14px 16px; border: 1px dashed color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: var(--radius); }
.s-moderate .s-section-title { border-bottom: 0; padding-bottom: 0; margin-bottom: 4px; }
.s-moderate .s-muted { margin: 0 0 10px; font-size: 13px; }

/* in-page confirm (used when the shell provides no app.confirm) */
.s-dialog-layer {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--gutter);
  background: color-mix(in srgb, var(--ink) 40%, transparent);
}
.s-dialog {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-family: var(--font-body);
}
.s-dialog-title { font-family: var(--font-display); font-size: 19px; margin: 0 0 8px; }
.s-dialog-body { color: var(--ink-2); line-height: 1.7; margin: 0 0 16px; }
.s-dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

/* ---------------------------------------------------------------- memorial: quieter, candle-lit */
.s-memorial {
  background: radial-gradient(ellipse 70% 300px at 50% 0, color-mix(in srgb, var(--warn) 10%, transparent), transparent 75%);
}
.s-memorial-candles { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin: 6px 0 12px; }
.s-memorial-totals { font-family: var(--font-mono); font-size: 13px; color: var(--ink-3); margin: 14px 0 0; }
.s-plaques { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 18px; }
.s-plaque {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 0;
  padding: 20px 16px 14px;
  text-align: center;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: box-shadow 0.25s ease;
}
.s-plaque:hover { box-shadow: var(--shadow); }
.s-plaque:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.s-plaque--ghost { min-height: 230px; background: var(--paper-2); animation: s-pulse 1.8s ease-in-out infinite; }
.s-plaque-flame { height: 44px; display: flex; align-items: flex-end; }
.s-plaque-no { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); margin: 6px 0 0; }
.s-plaque-name { font-family: var(--font-display); font-size: 21px; line-height: 1.25; margin: 2px 0 0; overflow-wrap: anywhere; }
.s-plaque-years { font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.06em; color: var(--ink-2); margin: 0; }
.s-plaque-place { font-size: 13px; color: var(--ink-3); margin: 0; }
.s-plaque-epitaph {
  width: 100%;
  margin: 10px 0 4px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-family: var(--font-display);
  line-height: 1.65;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.s-plaque-epitaph.is-empty { font-family: var(--font-body); font-size: 13px; color: var(--ink-3); }
.s-plaque-candles { margin: auto 0 0; padding-top: 6px; font-size: 12px; color: var(--ink-3); }
.s-detail.is-memorial .s-detail-head { text-align: center; }
.s-detail.is-memorial .s-badges { justify-content: center; }

/* ---------------------------------------------------------------- past lives */
.s-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 8px; }
.s-toolbar-count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.s-file { display: none; }
.s-paste {
  display: grid;
  gap: 8px;
  margin: 8px 0;
  padding: 12px;
  background: var(--paper-2);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.s-paste-actions { display: flex; justify-content: flex-end; gap: 8px; }
.s-import-status { min-height: 1.2em; margin: 4px 0 12px; font-size: 13px; color: var(--ink-2); }

.s-past-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.s-past-row {
  position: relative;
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 16px;
  padding: 14px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: box-shadow 0.2s ease;
}
.s-past-row:hover { box-shadow: var(--shadow); }
.s-past-row:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.s-past-idx { display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid var(--line); }
.s-past-no { font-family: var(--font-mono); font-size: 26px; line-height: 1; color: var(--seal); }
.s-past-when { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); }
.s-past-main { min-width: 0; }
.s-past-name { font-family: var(--font-display); font-size: 20px; margin: 2px 0; overflow-wrap: anywhere; }
.s-past-meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.s-past-title { font-size: 14px; margin: 4px 0 0; }
.s-past-cause { font-size: 13px; color: var(--ink-3); margin: 2px 0 0; }
.s-past-actions { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
.s-past-actions .s-badge { margin: 0; text-align: center; }

.s-trends { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.s-trends li { display: grid; grid-template-columns: 3em minmax(0, 1fr); align-items: center; gap: 8px; }
.s-trend-label { font-size: 13px; color: var(--ink-2); }
.s-trend { display: block; width: 100%; height: 30px; }
.s-trend-line { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.s-trend-line.is-proj { stroke-dasharray: 3 3; opacity: 0.8; }
.s-stroke-health { stroke: var(--st-health); }
.s-stroke-happiness { stroke: var(--st-happiness); }
.s-stroke-knowledge { stroke: var(--st-knowledge); }
.s-stroke-relationships { stroke: var(--st-relationships); }
.s-stroke-wealth { stroke: var(--st-wealth); }

.s-decisions { list-style: none; margin: 0 0 0 6px; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
.s-decision { position: relative; padding: 4px 0 14px 12px; }
.s-decision::before {
  content: "";
  position: absolute;
  left: -21px;
  top: 8px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid var(--ink-2);
}
.s-decision.is-proj::before { border-color: var(--proj); border-style: dashed; }
.s-decision-when { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.s-decision.is-proj .s-decision-when { color: var(--proj); }
.s-decision-title { margin: 2px 0; font-weight: 600; overflow-wrap: anywhere; }
.s-decision-title .s-badge { margin: 0 0 0 6px; font-weight: 400; }
.s-decision-choice { margin: 0; color: var(--ink-2); line-height: 1.65; overflow-wrap: anywhere; }

.s-log { display: grid; gap: 6px; }
.s-decade { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); }
.s-decade.is-proj { border-style: dashed; border-color: color-mix(in srgb, var(--proj) 55%, var(--line)); }
.s-decade > summary {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  list-style: none;
}
.s-decade > summary::-webkit-details-marker { display: none; }
.s-decade > summary::before { content: "▸"; color: var(--ink-3); transition: transform 0.15s ease; }
.s-decade[open] > summary::before { transform: rotate(90deg); }
.s-decade > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.s-decade-label { font-family: var(--font-display); flex: 1; }
.s-decade-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.s-log-list { list-style: none; margin: 0; padding: 0 14px 10px; }
.s-log-item {
  display: grid;
  grid-template-columns: 6.5em minmax(0, 1fr);
  gap: 10px;
  padding: 7px 0 7px 8px;
  border-top: 1px dashed var(--line);
}
.s-log-item.is-up { box-shadow: inset 2px 0 0 var(--good); }
.s-log-item.is-down { box-shadow: inset 2px 0 0 var(--bad); }
.s-log-when { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); padding-top: 3px; }
.s-log-item.is-proj .s-log-when { color: var(--proj); }
.s-log-text { margin: 0; line-height: 1.7; overflow-wrap: anywhere; }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 760px) {
  .s-detail-grid { grid-template-columns: minmax(0, 1fr); }
  .s-candlebox { margin-top: 8px; }
}
@media (max-width: 560px) {
  .s-head { padding-top: 20px; }
  .s-field { max-width: none; flex-basis: calc(50% - 6px); }
  .s-past-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .s-past-idx { flex-direction: row; justify-content: space-between; align-items: baseline; padding: 0 0 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .s-past-no { font-size: 18px; }
  .s-past-actions { flex-direction: row; flex-wrap: wrap; }
  .s-toolbar-count { margin-left: 0; width: 100%; }
  .s-log-item { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .s-map-row { grid-template-columns: 2.8em minmax(0, 1fr); gap: 6px; }
  .s-composer-row { flex-wrap: wrap; }
}

@media (prefers-reduced-motion: reduce) {
  .s-candle *, .s-card, .s-card--ghost, .s-plaque, .s-plaque--ghost, .s-decade > summary::before {
    animation: none !important;
    transition: none !important;
  }
}

/* real lives: documented real people */
.s-card-photo { display: block; width: 100%; height: 180px; object-fit: cover; object-position: center 25%; background: var(--paper-2); }
.s-real-photo { margin: 0; display: grid; gap: 6px; justify-items: start; }
.s-real-photo img { max-width: min(100%, 420px); max-height: 460px; object-fit: contain; background: var(--paper-2); }
.s-real-photo figcaption { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.s-real-photo a, .s-sources a { color: var(--accent); }
.s-sources { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

/* src/ui/stories.css */
/* 生活片段 — stories and the photo wall (.st- classes, tokens from styles.css only) */
.st-page { max-width: 1100px; margin: 0 auto; padding-block: 24px 64px; display: grid; gap: 18px; }
.st-hd { display: grid; gap: 6px; }
.st-eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--ink-3); }
.st-title { margin: 0; font-family: var(--font-display); font-size: clamp(26px, 4.4vw, 40px); line-height: 1.2; text-wrap: balance; color: var(--ink); }
.st-lede { margin: 0; max-width: 62ch; color: var(--ink-2); line-height: 1.8; }

.st-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.st-tab { appearance: none; border: 0; background: none; padding: 10px 14px; min-height: 42px; font: inherit; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.st-tab.is-on { color: var(--ink); border-bottom-color: var(--seal); font-weight: 600; }
.st-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.st-banner { border: 1px dashed var(--line); background: var(--paper-2); padding: 10px 14px; color: var(--ink-2); font-size: 14px; }
.st-banner p { margin: 0; }

.st-empty { border: 1px solid var(--line); background: var(--paper); padding: 28px 20px; display: grid; gap: 10px; justify-items: start; color: var(--ink-2); }
.st-empty p { margin: 0; line-height: 1.7; }
.st-empty-t { font-family: var(--font-display); font-size: 20px; color: var(--ink); }

.st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.st-card { background: var(--paper); border: 1px solid var(--line); cursor: pointer; display: grid; min-width: 0; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.st-card:hover, .st-card:focus-visible { transform: translateY(-2px); box-shadow: var(--shadow); outline: none; }
.st-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.st-photo { display: block; width: 100%; height: auto; max-height: 360px; object-fit: cover; background: var(--paper-2); }
.st-photo-missing { padding: 30px 14px; background: var(--paper-2); color: var(--ink-3); font-size: 13px; text-align: center; }
.st-card-b { padding: 12px 14px 14px; display: grid; gap: 6px; min-width: 0; }
.st-card-t { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.35; color: var(--ink); }
.st-card-x { margin: 0; color: var(--ink-2); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.st-meta { margin: 0; font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.st-badge { border: 1px solid var(--line); padding: 0 6px; font-size: 11px; color: var(--ink-2); }

.st-wall { columns: 4 220px; column-gap: 10px; }
.st-tile { appearance: none; border: 0; padding: 0; margin: 0 0 10px; display: block; width: 100%; position: relative; cursor: pointer; break-inside: avoid; background: var(--paper-2); }
.st-tile-img { display: block; width: 100%; height: auto; }
.st-tile-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; font-size: 13px; color: #fff; text-align: left;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0)); opacity: 0; transition: opacity 0.2s ease; }
.st-tile:hover .st-tile-cap, .st-tile:focus-visible .st-tile-cap { opacity: 1; }
.st-tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: none) { .st-tile-cap { opacity: 1; } }

.st-form { background: var(--paper); border: 1px solid var(--line); padding: 18px; display: grid; gap: 14px; max-width: 760px; }
.st-prompt { margin: 0; font-family: var(--font-display); font-size: 19px; color: var(--ink); line-height: 1.5; }
.st-field { display: grid; gap: 6px; min-width: 0; }
.st-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.st-l { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.st-in, .st-ta { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; min-height: 42px; width: 100%; box-sizing: border-box; }
.st-ta { resize: vertical; line-height: 1.7; }
.st-ta.is-small { min-height: 0; }
.st-in:focus-visible, .st-ta:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.st-count { justify-self: end; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.st-file { font: inherit; color: var(--ink-2); max-width: 100%; }
.st-preview { border: 1px dashed var(--line); padding: 10px; display: grid; gap: 8px; justify-items: start; color: var(--ink-3); font-size: 13px; }
.st-preview p { margin: 0; }
.st-preview-img { max-width: 100%; max-height: 320px; object-fit: contain; }
.st-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.st-tag { appearance: none; font: inherit; font-size: 13px; padding: 6px 12px; min-height: 40px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); cursor: pointer; }
.st-tag[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.st-vis { border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; margin: 0; }
.st-radio { display: flex; gap: 8px; align-items: center; color: var(--ink); min-height: 32px; }
.st-hint { margin: 0; font-size: 13px; color: var(--ink-3); line-height: 1.6; }
.st-msg { margin: 0; min-height: 1.2em; font-size: 14px; color: var(--ink-2); }
.st-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.st-btn { appearance: none; font: inherit; padding: 10px 18px; min-height: 42px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; }
.st-btn.is-primary { background: var(--ink); color: var(--bg); }
.st-btn.is-danger { border-color: var(--bad); color: var(--bad); }
.st-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.st-btn:focus-visible, .st-link:focus-visible, .st-rbtn:focus-visible, .st-tag:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.st-link { appearance: none; border: 0; background: none; padding: 4px 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.st-detail { background: var(--paper); border: 1px solid var(--line); padding: 18px; display: grid; gap: 12px; max-width: 820px; }
.st-back { justify-self: start; }
.st-detail-img { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; justify-self: center; background: var(--paper-2); }
.st-detail-t { margin: 0; font-family: var(--font-display); font-size: clamp(22px, 3.6vw, 30px); line-height: 1.3; color: var(--ink); text-wrap: balance; }
.st-detail-x { white-space: pre-line; line-height: 1.95; color: var(--ink); max-width: 65ch; font-size: 16px; }
.st-respond { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.st-sub { margin: 0; font-size: 15px; color: var(--ink-2); }
.st-react { display: flex; flex-wrap: wrap; gap: 8px; }
.st-rbtn { appearance: none; font: inherit; padding: 8px 14px; min-height: 42px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.st-rbtn[aria-pressed="true"] { border-color: var(--seal); color: var(--seal); }
.st-rcount { font-family: var(--font-mono); font-size: 12px; }
.st-replies { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.st-reply { border-left: 2px solid var(--line); padding: 4px 10px; }
.st-reply p { margin: 0; line-height: 1.7; }
.st-reply.is-empty { color: var(--ink-3); border-left-style: dashed; }
.st-reply-form { display: grid; gap: 8px; }

@media (max-width: 560px) {
  .st-row { grid-template-columns: 1fr; }
  .st-wall { columns: 2; column-gap: 6px; }
  .st-tile { margin-bottom: 6px; }
  .st-form, .st-detail { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { .st-card { transition: none; } .st-card:hover { transform: none; } }

.st-credit { margin: 0; font-size: 12px; color: var(--ink-3); line-height: 1.6; }
.st-credit a { color: var(--accent); }
</style>
<div id="app"></div>
<script src="app.js"></script>
